<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio My Library Prototype</title>
<style>
  :root{
    --nav:#2d3b45; --nav-text:#fff; --blue:#0374b5; --sel:#2b7abc; --ink:#2d3b45; --muted:#586874;
    --line:#c7cdd1; --bg:#fff; --soft:#f5f5f5; --danger:#e0061f; --ok:#03893d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Lato,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:16px}
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:flex;height:100%}

  /* global nav */
  .gnav{width:84px;background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex:none;overflow:hidden}
  .gnav .logo{width:44px;height:44px;border-radius:50%;border:3px dotted #fff;margin-bottom:10px}
  .gnav .item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:8px 2px;width:100%;text-align:center;line-height:1.1}
  .gnav .ic{width:28px;height:28px;stroke-width:1.5}
  .gnav .avatar{width:42px;height:42px;border-radius:50%;background:#c9cfd3}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topnav{height:56px;background:var(--soft);border-bottom:1px solid #e5e7e9;display:flex;align-items:center;padding:0 24px;gap:28px;flex:none}
  .topnav .ic{width:34px;height:34px;stroke-width:1.5;margin-right:12px;color:var(--ink)}
  .topnav a{padding:16px 2px;font-size:16px;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent}
  .topnav a.on{border-bottom-color:var(--ink);font-weight:700}

  .page{flex:1;overflow:auto;padding:24px 32px 40px}
  .head{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:40px;font-weight:700;margin:0}
  .tools{display:flex;gap:12px;align-items:center}
  .btn{border:1px solid var(--line);background:#f5f5f5;border-radius:4px;padding:0 16px;height:40px;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:#eceeef}
  .btn.icon{width:40px;padding:0;justify-content:center}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:#025f94}
  .btn.primary[disabled]{background:#9fc8e1;border-color:#9fc8e1;cursor:not-allowed}
  .btn.reset{background:#fff;border-color:var(--ink)}
  .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
  .btn.icon{justify-content:center}
  .kebab{display:inline-flex;align-items:center;justify-content:center}
  .viewbtns button{display:inline-flex;align-items:center;justify-content:center}
  .linkbtn{display:inline-flex;align-items:center;gap:6px}
  .tree .root .ic,.tree .node .ic{width:22px;height:22px}
  .tree .root .chev,.tree .node .chev{width:18px;height:18px}
  .tree .root .plus .ic{width:20px;height:20px;stroke-width:2}
  .menu button .ic{width:18px;height:18px}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .pills{display:flex;align-items:center;gap:16px;margin:16px 0 0}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;background:var(--soft);padding:3px 12px;font-size:14px}
  .pill button{border:0;background:none;padding:0;font-size:16px;line-height:1}
  .linkbtn{border:0;background:none;color:var(--blue);padding:0;font-size:16px}
  .linkbtn:hover{text-decoration:underline}

  .cols{display:flex;gap:32px;margin-top:28px}
  .side{width:300px;flex:none}
  .side h3{font-size:18px;margin:6px 0 10px}
  select.sel{width:100%;height:42px;border:1px solid var(--muted);border-radius:4px;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
  .tree{margin-top:20px}
  .tree .root{font-weight:700;background:var(--sel);color:#fff;border-radius:4px;height:52px;display:flex;align-items:center;padding:0 14px;gap:10px;font-size:17px}
  .tree .root .plus{margin-left:auto;display:flex}
  .tree .node{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;font-size:17px;font-weight:700;margin-top:8px}.tree .node .eye{margin-left:auto;display:flex}
  .tree ul{list-style:none;margin:8px 0 0;padding:0}
  .tree li{padding:14px 12px 14px 54px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .content{flex:1;min-width:0}
  .crumb{background:#f0f0f0;border-radius:4px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;font-size:17px}
  .subbar{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
  .selwrap{display:flex;align-items:center;gap:14px;font-size:17px;position:relative}
  .viewbtns{display:flex}
  .viewbtns button{width:40px;height:40px;border:1px solid var(--line);background:#fff}
  .viewbtns button.on{background:#4a5b68;color:#fff;border-color:#4a5b68}
  .viewbtns button:first-child{border-radius:4px 0 0 4px}.viewbtns button:last-child{border-radius:0 4px 4px 0}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-weight:700;padding:14px 10px;font-size:17px}
  td{padding:14px 10px;border-top:1px solid #c7cdd1;font-size:17px;vertical-align:middle}
  tr.row.checked td{background:#f1f7fb}
  td.title a{color:var(--blue);text-decoration:none}
  td.title a:hover{text-decoration:underline}
  .cc{display:inline-block;border:2px solid var(--ink);border-radius:4px;font-size:11px;font-weight:800;padding:0 3px;margin-left:10px;vertical-align:middle}
  .yt{display:inline-block;width:38px;height:26px;border-radius:7px;background:#f00;position:relative;vertical-align:middle}
  .yt:after{content:"";position:absolute;left:15px;top:7px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
  input[type=checkbox]{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin:0;vertical-align:middle;background:#fff;border:1px solid #8d959a;border-radius:4px;cursor:pointer;position:relative;flex:none}
  input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--ink);border-color:var(--ink)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  input[type=checkbox]:indeterminate::after{content:"";position:absolute;left:4px;top:9px;width:12px;height:2.5px;background:#fff}
  .kebab{width:36px;height:36px;border:0;background:none;font-size:22px;border-radius:4px;line-height:1}
  .kebab:hover{background:#eceeef}
  .state{font-size:13px;color:var(--muted);white-space:nowrap}
  .state b{color:#a15c00;font-weight:700}
  .selwrap .selsum{white-space:nowrap}
  .selwrap .linkbtn{font-size:14px;white-space:nowrap}
  .btn.icon[disabled]{opacity:.45;cursor:not-allowed}
  .btn.icon[disabled]:hover{background:#f5f5f5}
  .sortbtn{border:0;background:none;font:inherit;font-weight:700;padding:0;color:inherit;cursor:pointer;white-space:nowrap}
  .sortbtn:hover{text-decoration:underline}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding-top:16px;border-top:1px solid #c7cdd1;font-size:15px}
  .pager .pinfo{color:var(--muted)}
  .pager .pbtns{display:flex;align-items:center;gap:6px}
  .pager button{min-width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 10px;font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
  .pager button:hover:not([disabled]):not([aria-current]){background:#eceeef}
  .pager button[aria-current]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;cursor:default}
  .pager button[disabled]{opacity:.45;cursor:not-allowed}
  .pager .rot{transform:rotate(180deg)}
  .pager .ic{width:16px;height:16px}
  .protoopt{font-size:13px;font-weight:400;color:var(--muted);display:flex;align-items:center;gap:6px}
  .protoopt input{width:16px;height:16px}
  .empty{padding:48px 0;text-align:center;color:var(--muted);border-top:1px solid #c7cdd1}

  /* menus */
  .menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:210px;padding:6px 0}
  .menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:10px 18px;font-size:16px;align-items:center;gap:10px;color:var(--blue)}
  .menu button:hover:not([disabled]){background:var(--blue);color:#fff}
  .menu button[disabled]{color:#8d959a;cursor:not-allowed}
  .menu .note{display:block;padding:0 18px 8px 46px;font-size:13px;color:#6b7780;margin-top:-6px}
  .menu hr{border:0;border-top:1px solid #e0e3e5;margin:4px 12px}

  /* tray */
  .scrim{position:fixed;inset:0;background:rgba(45,59,69,.35);z-index:60}
  .tray{position:fixed;top:0;right:0;bottom:0;width:500px;max-width:92vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-4px 0 18px rgba(0,0,0,.2)}
  .tray header{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid #e5e7e9}
  .tray header h2{margin:0;font-size:30px}
  .tray .x{border:0;background:none;font-size:28px;line-height:1;padding:6px 10px}
  .tray .body{flex:1;overflow:auto;padding:24px 32px}
  .tray label.l{display:block;font-weight:700;font-size:18px;margin:0 0 8px}
  .tray .field{margin-bottom:22px}
  .tray input[type=text]{width:100%;height:42px;border:1px solid var(--muted);border-radius:4px;padding:0 12px;font:inherit}
  .tray .hint{font-size:14px;margin-top:4px}
  .tray .sep{border:0;border-top:1px solid #e0e3e5;margin:8px 0 22px}
  .tray footer{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-top:1px solid #e5e7e9;background:#f7f7f7}
  .tray footer .r{display:flex;gap:12px}
  .dim{opacity:.55}

  /* modal */
  .modal{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;width:520px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .modal h2{margin:0;padding:22px 28px 6px;font-size:24px}
  .modal .mb{padding:6px 28px 18px;font-size:17px;line-height:1.45}
  .modal .mb .sub{color:var(--muted);margin:0 0 12px}
  .modal .mb p{margin:0 0 8px}
  .modal .mf{display:flex;justify-content:flex-end;gap:12px;padding:16px 28px;background:#f5f5f5;border-radius:0 0 8px 8px;border-top:1px solid #e5e7e9}
  .scrim.m{z-index:70}
  .toast.plain:before{display:none}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2d3b45;color:#fff;padding:14px 22px;border-radius:6px;z-index:90;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .toast:before{content:"\2713";background:var(--ok);border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
  /* ---- responsive (collapse tree, then stacked list) ---- */
  .collbar,.mobsort,.mselall,.hamb{display:none}
  .collbar{width:100%;border:0;background:var(--sel);color:#fff;border-radius:4px;height:52px;align-items:center;gap:12px;padding:0 14px;font-size:17px;font-weight:700;text-align:left}
  .collbar .grow{flex:1}
  .collbar .ic{width:22px;height:22px}
  .selwrap{flex-wrap:wrap;row-gap:8px}
  .subbar{flex-wrap:wrap;gap:12px}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:86vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:4px 0 18px rgba(0,0,0,.2)}
  .drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e7e9}
  .drawer header h2{margin:0;font-size:22px}
  .drawer .x{border:0;background:none;font-size:24px;line-height:1;padding:6px 10px}
  .drawer .dbody{padding:16px 20px;overflow:auto}
  @media (max-width:900px){
    .side{display:none}
    .cols{flex-direction:column;gap:16px}
    .collbar{display:flex}
    .crumb>span:first-child{display:none}
    .crumb{justify-content:flex-end}
    .page{padding-top:0}
    .head{padding-top:24px}
    .subbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:12px 0 0;padding:10px 0;border-bottom:1px solid #e5e7e9}
  }
  @media (min-width:901px){ .drawer,.scrim.d{display:none} }
  @media (max-width:767px){
    .gnav{display:none}
    .hamb{display:inline-flex;border:0;background:none;padding:6px;margin-right:-8px}
    .hamb .ic{width:26px;height:26px;margin:0}
    .topnav{padding:0 16px;gap:20px}
    .pager{flex-direction:column;align-items:flex-start}
  }
  @media (max-width:640px){
    .page{padding:0 16px 32px}
    .head{padding-top:16px}
    h1{font-size:30px}
    .head{flex-wrap:wrap;gap:12px}
    .mobsort{display:flex;flex-direction:column;gap:6px;margin-top:16px;font-weight:700}
    .mselall{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #c7cdd1;font-size:16px}
    table,thead,tbody,tr.row,td{display:block}
    thead{display:none}
    tr.row{padding:12px 0;border-top:1px solid #c7cdd1}
    tr.row.checked{background:#f1f7fb}
    tr.row.checked td{background:none}
    td{border:0;padding:6px 0}
    td::before{content:attr(data-label);display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
    td[data-label=""]::before{display:none}
    td:empty{display:none}
    td.title a{font-size:18px}
    .pager .pnum:not([aria-current]),.pager .plabel{display:none}
    .tray{width:100%;max-width:100vw}
  }
  @media (max-width:480px){
    /* only the selection controls stay pinned; grid/list toggle scrolls with the results */
    .subbar{display:contents}
    .selwrap{position:sticky;top:0;z-index:20;background:var(--bg);margin:12px 0 0;padding:10px 0;border-bottom:1px solid #e5e7e9}
    .viewbtns{justify-content:flex-end;margin:10px 0 0}
  }
  .app{overflow:auto}
</style>
</head>
<body>
<div class="app">
  <nav class="gnav" aria-label="Global">
    <div class="logo"></div>
    <div class="item"><div class="avatar"></div>Account</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Admin</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="M12 14l4-5"/></svg>Dashboard</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6"/></svg>Courses</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>Inbox</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 13.5l7-3"/><path d="M13 9l3 1.5-1.5 3"/></svg>Commons</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="12" rx="1.5"/><path d="M10.5 7l3.5 2.5-3.5 2.5z"/><path d="M12 15.5V19M8 19h8"/></svg>Studio Staging</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="12" rx="1.5"/><path d="M10.5 7l3.5 2.5-3.5 2.5z"/><path d="M12 15.5V19M8 19h8"/></svg>Studio</div>
    <div class="item"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>Help</div>
  </nav>
  <div class="main">
    <div class="topnav">
      <button class="hamb" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="12" rx="1.5"/><path d="M10.5 7l3.5 2.5-3.5 2.5z"/><path d="M12 15.5V19M8 19h8"/></svg>
      <a href="#" class="on">My Library</a>
      <a href="#">Admin &#8964;</a>
      <a href="#">Settings</a>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<div id="overlays"></div>
<div id="toastHost" aria-live="polite" role="status"></div>

<script>
/* ---------- data ---------- */
const P='published', U='unpublished';
const T=(lang,s)=>({lang,status:s});
const SEED=[
  // no captions
  {t:'Welcome to Biology 101',size:'12 MB',date:'Oct 12, 2026',dur:'4:12',caps:[]},
  {t:'Lab Safety Walkthrough',size:'48 MB',date:'Oct 11, 2026',dur:'6:30',caps:[]},
  {t:'Campus Tour',yt:1,date:'Oct 9, 2026',dur:'3:44',caps:[]},
  {t:'Study Tips for Finals',size:'9 MB',date:'Oct 8, 2026',dur:'2:05',caps:[]},
  {t:'Guest Lecture: Urban Planning',size:'210 MB',date:'Oct 7, 2026',dur:'52:18',caps:[]},
  // published only
  {t:'Intro to Photosynthesis',size:'22 MB',date:'Oct 6, 2026',dur:'5:40',caps:[T('English',P)]},
  {t:'Spanish Greetings',size:'14 MB',date:'Oct 5, 2026',dur:'3:12',caps:[T('Spanish',P),T('English',P)]},
  {t:'Fractions Explained',size:'31 MB',date:'Oct 3, 2026',dur:'8:02',caps:[T('English',P)]},
  {t:'The Water Cycle',yt:1,date:'Oct 1, 2026',dur:'4:55',caps:[T('English',P)]},
  {t:'Poetry Reading: Dickinson',size:'18 MB',date:'Sep 29, 2026',dur:'7:21',caps:[T('English',P)]},
  // unpublished only
  {t:'Cell Division Overview',size:'27 MB',date:'Sep 28, 2026',dur:'6:15',caps:[T('English',U)]},
  {t:'French Cafe Dialogue',size:'16 MB',date:'Sep 26, 2026',dur:'3:50',caps:[T('French',U),T('English',U)]},
  {t:'Intro to Python Loops',size:'64 MB',date:'Sep 24, 2026',dur:'12:09',caps:[T('English',U),T('Spanish',U),T('German',U)]},
  {t:'Renaissance Art Tour',size:'88 MB',date:'Sep 22, 2026',dur:'15:33',caps:[T('English',U)]},
  {t:'Climate Data Basics',size:'41 MB',date:'Sep 20, 2026',dur:'9:48',caps:[T('English',U),T('French',U)]},
  // both
  {t:'Algebra Basics Lecture',size:'96 MB',date:'Sep 18, 2026',dur:'18:20',caps:[T('English',P),T('Spanish',U)]},
  {t:'History of Jazz',size:'72 MB',date:'Sep 15, 2026',dur:'14:02',caps:[T('English',P),T('French',U)]},
  {t:'Chemistry Demo: Reactions',size:'55 MB',date:'Sep 12, 2026',dur:'10:11',caps:[T('English',P),T('Spanish',U),T('German',U)]},
  {t:'Mindfulness Minute',size:'6 MB',date:'Sep 10, 2026',dur:'1:00',caps:[T('English',P),T('English (AU)',U)]},
  {t:'Podcast Episode 12',size:'38 MB',date:'Sep 8, 2026',dur:'28:47',caps:[T('English',P),T('Spanish',P),T('French',U)]},
];
// extend to 100 items (5 pages of 20): generated items cycle through all four caption states
const TOPICS=['Intro to Genetics','Reading Graphs','Ecosystems at Work','Medieval Trade Routes','Writing a Thesis','Newton\u2019s Laws','Budgeting Basics','Sound and Waves','The French Revolution','Cell Respiration','Digital Citizenship','Geometry Proofs','Plate Tectonics','Public Speaking','Color Theory','Music Rhythm Basics','Nutrition Labels','Lab Notebook Habits','Ancient Egypt','Data Privacy Basics'];
const LANGS=['English','Spanish','French','German','Portuguese','Japanese'];
const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const DAY=86400000;
SEED.forEach(m=>{ const [mo,d,y]=m.date.replace(',','').split(' '); m.ts=Date.UTC(+y,MONTHS[mo],+d); });
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
for(let i=0;i<80;i++){
  const k=(i+(i>>2))%4;               // 0 none, 1 published only, 2 unpublished only, 3 both
  const caps=[]; const lg=j=>LANGS[(i+j)%LANGS.length];
  if(k===1||k===3){ caps.push(T(lg(0),P)); if(i%5===0) caps.push(T(lg(1),P)); }
  if(k===2||k===3){ const n=1+(i%3===0?1:0)+(i%7===0?1:0)+(k===3&&i%4===0?1:0); for(let j=0;j<n;j++) caps.push(T(lg(j+2),U)); }
  const ts=Date.UTC(2026,8,7)-Math.round(i*1.4*DAY);
  const mins=2+((i*7)%31), secs=(i*13)%60;
  const item={t:TOPICS[i%20]+', Part '+(Math.floor(i/20)+1),date:fmtDate(ts),ts,dur:mins+':'+String(secs).padStart(2,'0'),caps};
  if(i%9===4) item.yt=1; else item.size=(5+((i*37)%120))+' MB';
  SEED.push(item);
}

/* ---------- state ---------- */
let media, selected, filter, draft, ui, page, sort, showState=false, toastTimer;
function resetAll(){
  media=clone(SEED); selected=new Set(); filter='all'; draft='all'; page=1; sort={key:'date',dir:'desc'};
  ui={tray:false, bulkMenu:false, rowMenu:null, modal:null, drawer:false};
  clearTimeout(toastTimer); document.getElementById('toastHost').innerHTML='';
  render();
}
function visible(){
  const list=media.filter(m=>{
    if(filter==='with') return pubN(m)>0;
    if(filter==='without') return pubN(m)===0;
    if(filter==='unpub') return unpubN(m)>0;
    return true;
  });
  const d=sort.dir==='asc'?1:-1;
  return list.sort((a,b)=>{
    const c=sort.key==='title'?a.t.localeCompare(b.t):a.ts-b.ts;
    return (c||a.id-b.id)*d;
  });
}
function view(){
  const all=visible(); const total=all.length;
  const pages=Math.max(1,Math.ceil(total/PAGE)); page=Math.min(Math.max(1,page),pages);
  return {all,total,pages,rows:all.slice((page-1)*PAGE,page*PAGE)};
}
const plural=(n,s,p)=>n+' '+(n===1?s:p||s+'s');

function openMenuAt(btn,html){
  const r=btn.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='menu'; el.setAttribute('role','menu'); el.innerHTML=html;
  document.getElementById('overlays').appendChild(el);
  const w=el.offsetWidth,hh=el.offsetHeight;
  let left=Math.min(r.left, window.innerWidth-w-12);
  if(btn.classList.contains('kebab')) left=Math.max(12,r.right-w);
  let top=r.bottom+6; if(top+hh>window.innerHeight-8) top=Math.max(8,r.top-hh-6);
  el.style.left=left+'px'; el.style.top=top+'px';
}
function renderMenus(){
  if(ui.modal||ui.tray||ui.drawer) return;
  if(ui.bulkMenu){
    const sel=[...selected].map(id=>media.find(m=>m.id===id));
    const can=sel.some(m=>unpubN(m)>0);
    openMenuAt(document.getElementById('bulkBtn'),`
      <button role="menuitem" data-act="deselectAll" ${selected.size?'':'disabled'}>Deselect All</button>
      <button role="menuitem" data-act="noop">${ic('move')}Move to</button>
      <button role="menuitem" data-act="noop">${ic('tag')}Add Tags</button>
      <hr>
      <button role="menuitem" data-act="bulkPublish" ${can?'':'disabled'} aria-disabled="${!can}">${ic('publish')}Publish captions</button>
      <button role="menuitem" disabled aria-disabled="true">${ic('archive')}Archive</button>`);
  }
  if(ui.rowMenu){
    const m=media.find(x=>x.id===ui.rowMenu);
    const btn=document.querySelector(`[data-row="${m.id}"]`);
    if(btn) openMenuAt(btn,`
      <button role="menuitem" data-act="noop">Edit</button>
      <button role="menuitem" data-act="noop">Share</button>
      <button role="menuitem" data-act="noop">Download</button>
      <button role="menuitem" data-act="noop">Copy link</button>
      <button role="menuitem" data-act="noop">Move to</button>
      <button role="menuitem" data-act="noop">Add Tags</button>
      ${unpubN(m)>0?`<hr><button role="menuitem" data-act="rowPublish" data-id="${m.id}">Publish captions</button><hr>`:''}
      <button role="menuitem" data-act="noop">Archive</button>`);
  }
}

function toast(msg,plain){
  const host=document.getElementById('toastHost');
  host.innerHTML=`<div class="toast${plain?' plain':''}">${msg}</div>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>host.innerHTML='',4500);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#resetBtn')) return resetAll();
  if(t.closest('#filterBtn')){ draft=filter; ui.tray=true; ui.bulkMenu=false; ui.rowMenu=null; return renderOverlaysOnly(); }
  if(t.closest('#bulkBtn')){ ui.bulkMenu=!ui.bulkMenu; ui.rowMenu=null; return renderOverlaysOnly(); }
  const pg=t.closest('[data-page]');
  if(pg){ if(pg.disabled||pg.hasAttribute('aria-current')) return; page=+pg.dataset.page; ui.bulkMenu=ui.rowMenu=null; render(); const c=document.querySelector('.crumb'); if(c) c.scrollIntoView({block:'start'}); return; }
  const sb=t.closest('[data-sort]');
  if(sb){ const k=sb.dataset.sort; sort=sort.key===k?{key:k,dir:sort.dir==='asc'?'desc':'asc'}:{key:k,dir:k==='title'?'asc':'desc'}; page=1; ui.bulkMenu=ui.rowMenu=null; return render(); }
  const rowBtn=t.closest('[data-row]');
  if(rowBtn){ const id=+rowBtn.dataset.row; ui.rowMenu=ui.rowMenu===id?null:id; ui.bulkMenu=false; return renderOverlaysOnly(); }

  const a=t.closest('[data-act]'); const act=a&&a.dataset.act;
  if(a && a.disabled) return;
  if(act){
    switch(act){
      case 'noop': ui.bulkMenu=ui.rowMenu=null; break;
      case 'closeTray': ui.tray=false; break;
      case 'openDrawer': ui.drawer=true; ui.bulkMenu=ui.rowMenu=null; break;
      case 'closeDrawer': ui.drawer=false; break;
      case 'trayReset': draft='all'; break;
      case 'applyFilter': filter=draft; page=1; ui.tray=false; selected.clear(); return render();
      case 'clearFilter': filter='all'; page=1; selected.clear(); return render();
      case 'selectAllResults': visible().forEach(m=>selected.add(m.id)); return render();
      case 'clearSelection': selected.clear(); ui.bulkMenu=false; return render();
      case 'deselectAll': selected.clear(); ui.bulkMenu=false; return render();
      case 'bulkPublish': ui.modal={mode:'bulk',ids:[...selected]}; ui.bulkMenu=false; break;
      case 'rowPublish': ui.modal={mode:'row',ids:[+a.dataset.id]}; ui.rowMenu=null; break;
      case 'closeModal': ui.modal=null; break;
      case 'reviewCaptions': { const m=media.find(x=>x.id===+a.dataset.id); ui.modal=null; toast(`Prototype: this would open Manage captions for \u201c${esc(m.t)}\u201d.`,true); break; }
      case 'confirmPublish': return confirmPublish();
    }
    return renderOverlaysOnly();
  }
  // click outside menus closes them
  if(ui.bulkMenu||ui.rowMenu){ ui.bulkMenu=false; ui.rowMenu=null; renderOverlaysOnly(); }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='capSel'){ draft=t.value; return renderOverlaysOnly(); }
  if(t.id==='stateToggle'){ showState=t.checked; return render(); }
  if(t.id==='mobSort'){ const [k,d]=t.value.split(':'); sort={key:k,dir:d}; page=1; ui.bulkMenu=false; return render(); }
  if(t.id==='selAll'||t.id==='selAllM'){
    view().rows.forEach(m=>{ t.checked?selected.add(m.id):selected.delete(m.id); });
    ui.bulkMenu=false; return render();
  }
  if(t.dataset.id && t.type==='checkbox'){
    const id=+t.dataset.id;
    const {total:tot,rows:pr}=view();
    if(!t.checked && selected.size===tot && tot>PAGE){
      // leaving "All X results selected": keep only the other items on the current page
      selected=new Set(pr.map(m=>m.id).filter(x=>x!==id));
    } else { t.checked?selected.add(id):selected.delete(id); }
    ui.bulkMenu=false; return render();
  }
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(ui.modal) ui.modal=null; else if(ui.tray) ui.tray=false; else if(ui.drawer) ui.drawer=false; else ui.bulkMenu=ui.rowMenu=null;
  renderOverlaysOnly();
});

function renderOverlaysOnly(){ document.getElementById('overlays').innerHTML=''; renderOverlays(); }

function confirmPublish(){
  const ids=new Set(ui.modal.ids); let n=0, items=0; const bulk=ui.modal.mode==='bulk';
  media.forEach(m=>{ if(ids.has(m.id)){ const before=n; m.caps.forEach(c=>{ if(c.status===U){ c.status=P; n++; } }); if(n>before) items++; } });
  ui.modal=null; selected.clear();
  render();
  toast(bulk?`Captions published for ${plural(items,'media item')}.`:`${plural(n,'caption')} published.`);
}

resetAll();
</script>
</body>
